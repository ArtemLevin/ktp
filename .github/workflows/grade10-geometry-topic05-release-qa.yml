name: Grade 10 Atanasyan Topic 05 Release QA

on:
  pull_request:
    paths:
      - 'content/10-geometry-atanasyan/05*'
      - 'content/10-geometry-atanasyan/content-map.md'
      - 'topics/10-geometry-atanasyan/05.html'
      - 'lessons/10-geometry-atanasyan/05/**'
      - 'assessments/10-geometry-atanasyan/05/**'
      - 'assessments/topic-links.js'
      - 'labs/10-geometry-atanasyan/spatial-router/**'
      - 'README.md'
      - 'Plan.md'
      - 'lessons/README.md'
      - 'assessments/README.md'
      - 'scripts/qa-grade10-geometry-topic05*.mjs'
      - '.github/workflows/grade10-geometry-topic05-release-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'content/10-geometry-atanasyan/05*'
      - 'lessons/10-geometry-atanasyan/05/**'
      - 'assessments/10-geometry-atanasyan/05/**'
      - 'labs/10-geometry-atanasyan/spatial-router/**'
      - 'scripts/qa-grade10-geometry-topic05-final*.mjs'

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Topic 05 final assessment, mathematics and documentation
        run: |
          node scripts/qa-grade10-geometry-topic05-final.mjs
          node scripts/qa-grade10-geometry-topic05-final-docs.mjs
      - name: Topic 05 staged regressions
        run: |
          node scripts/qa-grade10-geometry-topic05-plan.mjs
          node scripts/qa-grade10-geometry-topic05-core.mjs
          node scripts/qa-grade10-geometry-topic05-lessons-a.mjs
          node scripts/qa-grade10-geometry-topic05-lessons-b.mjs
      - name: Earlier grade 10 topics and foundation
        run: |
          node scripts/qa-grade10-geometry-topic04-final.mjs
          node scripts/qa-grade10-geometry-topic04-final-docs.mjs
          node scripts/qa-grade10-geometry-topic03.mjs
          node scripts/qa-grade10-geometry-topic03-docs.mjs
          node scripts/qa-grade10-geometry-topic02.mjs
          node scripts/qa-grade10-geometry-topic02-docs.mjs
          node scripts/qa-grade10-geometry-topic01.mjs
          node scripts/qa-grade10-geometry-topic01-docs.mjs
          node scripts/qa-grade10-geometry-foundation.mjs
      - name: Grade 9 documentation regression
        run: node scripts/qa-grade9-geometry-topic07-docs.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Topic, eight lessons, router, assessments and print
        run: |
          node scripts/qa-grade10-geometry-topic05-core-browser.mjs
          node scripts/qa-grade10-geometry-topic05-lessons-a-browser.mjs
          node scripts/qa-grade10-geometry-topic05-lessons-b-browser.mjs
          node scripts/qa-grade10-geometry-topic05-final-browser.mjs
