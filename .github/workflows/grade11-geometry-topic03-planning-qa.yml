name: Grade 11 Atanasyan Topic 03 Planning QA

on:
  pull_request:
    paths:
      - 'content/11-geometry-atanasyan/03-methodical-plan.md'
      - 'content/11-geometry-atanasyan/content-map.md'
      - 'lessons/11-geometry-atanasyan/lesson-plan.md'
      - 'geometry/revolution-math.js'
      - 'geometry/revolution-scene.js'
      - 'Plan.md'
      - 'scripts/qa-grade11-geometry-topic03-planning.mjs'
      - '.github/workflows/grade11-geometry-topic03-planning-qa.yml'
  push:
    branches: [main]
    paths:
      - 'content/11-geometry-atanasyan/03-methodical-plan.md'
      - 'content/11-geometry-atanasyan/content-map.md'
      - 'lessons/11-geometry-atanasyan/lesson-plan.md'
      - 'geometry/revolution-math.js'
      - 'geometry/revolution-scene.js'
      - 'Plan.md'
      - 'scripts/qa-grade11-geometry-topic03-planning.mjs'
      - '.github/workflows/grade11-geometry-topic03-planning-qa.yml'

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Topic 03 planning contract
        run: node scripts/qa-grade11-geometry-topic03-planning.mjs
      - name: Grade 11 foundation regressions
        run: |
          node scripts/qa-grade11-geometry-foundation.mjs
          node scripts/qa-grade11-revolution-core.mjs
      - name: Published topic regressions
        run: |
          node scripts/qa-grade11-geometry-topic02-foundation.mjs
          node scripts/qa-grade11-geometry-topic02-lab.mjs
          node scripts/qa-grade11-geometry-topic02-assessments.mjs
      - name: Grade 10 geometry regression
        run: |
          node scripts/qa-grade10-geometry-topic05-final.mjs
          node scripts/qa-grade10-geometry-topic05-final-docs.mjs
