name: Grade 10 Atanasyan Topic 01 QA

on:
  pull_request:
    paths:
      - 'content/10-geometry-atanasyan/01.js'
      - 'content/10-geometry-atanasyan/01-methodical-plan.md'
      - 'content/10-geometry-atanasyan/methodical-plan.md'
      - 'content/10-geometry-atanasyan/content-map.md'
      - 'topics/10-geometry-atanasyan/01.html'
      - 'lessons/10-geometry-atanasyan/01/**'
      - 'assessments/10-geometry-atanasyan/01/**'
      - 'assessments/topic-links.js'
      - 'geometry/spatial-scene.js'
      - 'geometry/spatial-scene.css'
      - 'geometry/lesson-spatial.js'
      - 'README.md'
      - 'Plan.md'
      - 'lessons/README.md'
      - 'assessments/README.md'
      - 'scripts/qa-grade10-geometry-foundation.mjs'
      - 'scripts/qa-grade10-geometry-topic01*.mjs'
      - '.github/workflows/grade10-geometry-topic01-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'content/10-geometry-atanasyan/01.js'
      - 'content/10-geometry-atanasyan/01-methodical-plan.md'
      - 'content/10-geometry-atanasyan/methodical-plan.md'
      - 'topics/10-geometry-atanasyan/01.html'
      - 'lessons/10-geometry-atanasyan/01/**'
      - 'assessments/10-geometry-atanasyan/01/**'
      - 'assessments/topic-links.js'
      - 'scripts/qa-grade10-geometry-topic01*.mjs'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Topic 01 structural/source QA
        run: node scripts/qa-grade10-geometry-topic01.mjs
      - name: Topic 01 documentation QA
        run: node scripts/qa-grade10-geometry-topic01-docs.mjs
      - name: Foundation regression
        run: node scripts/qa-grade10-geometry-foundation.mjs
      - name: Grade 9 final-topic regression
        run: |
          node scripts/qa-grade9-geometry-topic07.mjs
          node scripts/qa-grade9-geometry-topic07-docs.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser QA dependency
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser, mobile, spatial and print QA
        run: node scripts/qa-grade10-geometry-topic01-browser.mjs
