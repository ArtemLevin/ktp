name: Grade 10 Atanasyan Topic 04 Core QA

on:
  pull_request:
    paths:
      - 'content/10-geometry-atanasyan/04.js'
      - 'content/10-geometry-atanasyan/04-methodical-plan.md'
      - 'topics/10-geometry-atanasyan/04.html'
      - 'geometry/spatial-scene.js'
      - 'geometry/spatial-scene.css'
      - 'assessments/topic-links.js'
      - 'scripts/qa-grade10-geometry-topic04-core*.mjs'
      - '.github/workflows/grade10-geometry-topic04-core-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'content/10-geometry-atanasyan/04.js'
      - 'topics/10-geometry-atanasyan/04.html'
      - 'scripts/qa-grade10-geometry-topic04-core*.mjs'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Topic 04 core/source QA
        run: node scripts/qa-grade10-geometry-topic04-core.mjs
      - name: Planning regression
        run: node scripts/qa-grade10-geometry-topic04-plan.mjs
      - name: Topic 03 regression
        run: node scripts/qa-grade10-geometry-topic03.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Topic core browser/mobile/print QA
        run: node scripts/qa-grade10-geometry-topic04-core-browser.mjs
