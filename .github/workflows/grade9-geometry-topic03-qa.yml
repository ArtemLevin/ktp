name: Grade 9 Atanasyan Topic 03 QA
on:
  pull_request:
    paths:
      - 'content/9-geometry-atanasyan/03.js'
      - 'content/9-geometry-atanasyan/03-methodical-plan.md'
      - 'content/9-geometry-atanasyan/content-map.md'
      - 'topics/9-geometry-atanasyan/03.html'
      - 'lessons/9-geometry-atanasyan/03/**'
      - 'lessons/9-geometry-atanasyan/lesson-plan.md'
      - 'assessments/9-geometry-atanasyan/03/**'
      - 'assessments/topic-links.js'
      - 'labs/9-geometry-atanasyan/triangle-relations/**'
      - 'README.md'
      - 'Plan.md'
      - 'lessons/README.md'
      - 'assessments/README.md'
      - 'scripts/qa-grade9-geometry-topic03*.mjs'
      - '.github/workflows/grade9-geometry-topic03-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'content/9-geometry-atanasyan/03.js'
      - 'content/9-geometry-atanasyan/03-methodical-plan.md'
      - 'topics/9-geometry-atanasyan/03.html'
      - 'lessons/9-geometry-atanasyan/03/**'
      - 'assessments/9-geometry-atanasyan/03/**'
      - 'labs/9-geometry-atanasyan/triangle-relations/**'
      - 'scripts/qa-grade9-geometry-topic03*.mjs'
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Topic 03 structural/source QA
        run: node scripts/qa-grade9-geometry-topic03.mjs
      - name: Topic 03 documentation QA
        run: node scripts/qa-grade9-geometry-topic03-docs.mjs
      - name: Topic 02 regression
        run: |
          node scripts/qa-grade9-geometry-topic02.mjs
          node scripts/qa-grade9-geometry-topic02-docs.mjs
      - name: Topic 01 regression
        run: |
          node scripts/qa-grade9-geometry-topic01.mjs
          node scripts/qa-grade9-geometry-topic01-docs.mjs
      - name: Foundation regression
        run: node scripts/qa-grade9-geometry-foundation.mjs
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Browser, mobile, laboratory and print QA
        run: node scripts/qa-grade9-geometry-topic03-browser.mjs
