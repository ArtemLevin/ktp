name: Grade 6 Course Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/.grade6-course-payload/**'
      - 'scripts/_grade6_payload_01.txt'
      - '.github/workflows/unpack-grade6-course.yml'

permissions:
  contents: write

jobs:
  unpack-and-verify:
    if: github.head_ref == 'feature/6-math-vilenkin-course'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6-math-vilenkin-course
          fetch-depth: 0

      - name: Decode and unpack prepared payload
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.grade6-course-payload/chunk_[0-9][0-9] > /tmp/grade6.b64
          base64 -d /tmp/grade6.b64 > /tmp/grade6.gz
          gzip -dc /tmp/grade6.gz > /tmp/grade6.payload
          echo 'Decoded payload type:'
          file /tmp/grade6.payload || true
          echo 'Decoded payload size:'
          wc -c /tmp/grade6.payload
          echo 'Decoded payload prefix:'
          head -c 160 /tmp/grade6.payload | cat -v || true
          echo

          if tar -tf /tmp/grade6.payload >/dev/null 2>&1; then
            echo 'Payload format: tar archive'
            tar -xf /tmp/grade6.payload -C .
          elif head -n 1 /tmp/grade6.payload | grep -Eq '^#!.*(bash|sh)'; then
            echo 'Payload format: shell script'
            bash /tmp/grade6.payload
          elif head -n 1 /tmp/grade6.payload | grep -Eq '^#!.*python'; then
            echo 'Payload format: Python script'
            python3 /tmp/grade6.payload
          else
            echo 'Unsupported prepared payload format' >&2
            exit 2
          fi

          rm -rf scripts/.grade6-course-payload
          rm -f scripts/_grade6_payload_01.txt
          rm -f .github/workflows/unpack-grade6-course.yml

      - name: Verify generated course
        shell: bash
        run: |
          set -euo pipefail
          test -f lessons/6-math-vilenkin/lesson-plan.md
          test -f scripts/qa-grade6-vilenkin-course.mjs
          node scripts/qa-grade6-vilenkin-course.mjs

      - name: Commit generated course
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KTP Course Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete grade 6 Vilenkin course'
          git push origin HEAD:feature/6-math-vilenkin-course
