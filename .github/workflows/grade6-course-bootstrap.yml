name: Grade 6 Course Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/.grade6-course-payload/**'
      - 'scripts/_grade6_payload_01.txt'

permissions:
  contents: write

jobs:
  unpack-and-verify:
    if: github.head_ref == 'feature/6-math-vilenkin-course'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6-math-vilenkin-course
          fetch-depth: 0

      - name: Recover prepared course payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, json, os, tarfile

          repo = Path('.').resolve()
          legacy = Path('scripts/_grade6_payload_01.txt')
          chunks = sorted(Path('scripts/.grade6-course-payload').glob('chunk_[0-9][0-9]'))

          def clean(path):
              return ''.join(path.read_text(encoding='utf-8').split())

          def dec64(text):
              text += '=' * ((4 - len(text) % 4) % 4)
              return base64.b64decode(text.encode('ascii'), altchars=b'-_', validate=False)

          texts=[]
          if legacy.exists():
              text=clean(legacy)
              print('legacy chars=',len(text),'mod4=',len(text)%4,'prefix=',text[:16],'suffix=',text[-16:])
              texts.append(('legacy',text))
          if chunks:
              parts=[clean(p) for p in chunks]
              print('chunks=',[(p.name,len(s),len(s)%4) for p,s in zip(chunks,parts)])
              texts.append(('chunks-joined',''.join(parts)))

          payload=None; used=None
          for label,text in texts:
              try:
                  raw=dec64(text)
                  print(label,'decoded bytes=',len(raw),'magic=',repr(raw[:8]))
                  candidate=gzip.decompress(raw)
                  print(label,'gzip success bytes=',len(candidate),'prefix=',repr(candidate[:100]))
                  payload=candidate; used=label; break
              except Exception as exc:
                  print(label,'failed:',type(exc).__name__,str(exc))

          if payload is None:
              raise SystemExit('No recoverable payload candidate')

          out=Path('/tmp/grade6.payload'); out.write_bytes(payload)
          if tarfile.is_tarfile(out):
              with tarfile.open(out,'r:*') as tf:
                  members=tf.getmembers()
                  for m in members:
                      target=(repo/m.name).resolve()
                      if target!=repo and not str(target).startswith(str(repo)+os.sep):
                          raise SystemExit(f'Unsafe archive path: {m.name}')
                  tf.extractall(repo)
              print('Extracted tar entries:',len(members),'using',used)
          else:
              data=json.loads(payload.decode('utf-8'))
              items=data.get('files',data) if isinstance(data,dict) else data
              if isinstance(items,dict): items=[{'path':k,'content':v} for k,v in items.items()]
              if not isinstance(items,list): raise SystemExit('Unsupported manifest shape')
              for item in items:
                  target=(repo/item['path']).resolve()
                  if target!=repo and not str(target).startswith(str(repo)+os.sep):
                      raise SystemExit(f"Unsafe manifest path: {item['path']}")
                  target.parent.mkdir(parents=True,exist_ok=True)
                  if item.get('encoding')=='base64': target.write_bytes(base64.b64decode(item.get('content','')))
                  else: target.write_text(item.get('content',''),encoding='utf-8')
              print('Extracted manifest entries:',len(items),'using',used)
          PY

          rm -rf scripts/.grade6-course-payload
          rm -f scripts/_grade6_payload_01.txt

      - name: Verify generated course
        shell: bash
        run: |
          set -euo pipefail
          test -f lessons/6-math-vilenkin/lesson-plan.md
          test -f scripts/qa-grade6-vilenkin-course.mjs
          node scripts/qa-grade6-vilenkin-course.mjs

      - name: Commit generated course
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KTP Course Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete grade 6 Vilenkin course'
          git push origin HEAD:feature/6-math-vilenkin-course
