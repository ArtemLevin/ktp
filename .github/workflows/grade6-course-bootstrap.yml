name: Grade 6 Course Bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/.grade6-builder/**'
      - 'scripts/.grade6-course-payload/**'
      - 'scripts/_grade6_payload_01.txt'

permissions:
  contents: write

jobs:
  build-and-verify:
    if: github.head_ref == 'feature/6-math-vilenkin-course'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6-math-vilenkin-course
          fetch-depth: 0

      - name: Assemble deterministic course builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          parts = sorted(Path('scripts/.grade6-builder').glob('part_*'))
          if not parts:
              raise SystemExit('No builder parts found')
          encoded = ''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts)
          print('Builder parts:', [(p.name, p.stat().st_size) for p in parts])
          print('Encoded chars:', len(encoded), 'mod4=', len(encoded) % 4)
          encoded += '=' * ((4 - len(encoded) % 4) % 4)
          source = base64.b64decode(encoded, validate=False)
          Path('/tmp/build-grade6.mjs').write_bytes(source)
          print('Builder bytes:', len(source))
          print('Builder tail:', source[-180:].decode('utf-8', errors='replace'))
          PY
          node --check /tmp/build-grade6.mjs
          node /tmp/build-grade6.mjs

          rm -rf scripts/.grade6-builder
          rm -rf scripts/.grade6-course-payload
          rm -f scripts/_grade6_payload_01.txt

      - name: Verify generated course
        shell: bash
        run: |
          set -euo pipefail
          test -f lessons/6-math-vilenkin/lesson-plan.md
          test -f scripts/qa-grade6-vilenkin-course.mjs
          node scripts/qa-grade6-vilenkin-course.mjs

      - name: Commit generated course
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KTP Course Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Complete grade 6 Vilenkin course'
            git push origin HEAD:feature/6-math-vilenkin-course
          fi
