name: Grade 11 Atanasyan Final Course QA
on:
  pull_request:
    paths:
      - 'content/11-geometry-atanasyan/**'
      - 'topics/11-geometry-atanasyan/**'
      - 'content/registry.js'
      - 'topics/topic-page.*'
      - 'lessons/11-geometry-atanasyan/**'
      - 'lessons/lesson-*.js'
      - 'lessons/lesson-page.css'
      - 'lessons/global-numbering.js'
      - 'lessons/README.md'
      - 'geometry/**'
      - 'labs/11-geometry-atanasyan/review-route/**'
      - 'assessments/11-geometry-atanasyan/**'
      - 'assessments/assessment-page.*'
      - 'assessments/topic-links.js'
      - 'assessments/README.md'
      - 'scripts/qa-grade11-geometry-*.mjs'
      - 'scripts/review-question-audit.mjs'
      - 'scripts/vector-question-audit.mjs'
      - 'scripts/coordinate-question-audit.mjs'
      - 'scripts/grade11-geometry-progress.mjs'
      - 'js/data.js'
      - 'README.md'
      - 'Plan.md'
      - '.github/workflows/grade11-geometry-topic06-qa.yml'
  push:
    branches: [main]
    paths:
      - 'content/11-geometry-atanasyan/**'
      - 'topics/11-geometry-atanasyan/**'
      - 'content/registry.js'
      - 'topics/topic-page.*'
      - 'lessons/11-geometry-atanasyan/**'
      - 'lessons/lesson-*.js'
      - 'lessons/lesson-page.css'
      - 'lessons/global-numbering.js'
      - 'lessons/README.md'
      - 'geometry/**'
      - 'labs/11-geometry-atanasyan/review-route/**'
      - 'assessments/11-geometry-atanasyan/**'
      - 'assessments/assessment-page.*'
      - 'assessments/topic-links.js'
      - 'assessments/README.md'
      - 'scripts/qa-grade11-geometry-*.mjs'
      - 'scripts/review-question-audit.mjs'
      - 'scripts/vector-question-audit.mjs'
      - 'scripts/coordinate-question-audit.mjs'
      - 'scripts/grade11-geometry-progress.mjs'
      - 'js/data.js'
      - 'README.md'
      - 'Plan.md'
      - '.github/workflows/grade11-geometry-topic06-qa.yml'
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full grade 11 math, structure and documentation
        run: |
          for script in scripts/qa-grade11-geometry-*.mjs; do
            case "$script" in *browser*) continue ;; esac
            node "$script"
          done
          node scripts/qa-grade10-geometry-foundation.mjs
          node scripts/qa-grade10-geometry-topic05-final.mjs
          node scripts/qa-grade10-geometry-topic05-final-docs.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Final lessons, diagnostic router and all 68 routes
        env:
          KTP_QA_ARTIFACT_DIR: qa-artifacts
        run: |
          node scripts/qa-grade11-geometry-topic06-lessons-browser.mjs
          node scripts/qa-grade11-geometry-topic06-browser.mjs
          node scripts/qa-grade11-geometry-topic05-browser.mjs
          node scripts/qa-grade10-geometry-foundation-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grade11-final-course-qa
          path: qa-artifacts/
          if-no-files-found: warn
