name: Grade 5 Vilenkin Topic 11 QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/5-math-vilenkin/11.js'
      - 'topics/5-math-vilenkin/11.html'
      - 'lessons/5-math-vilenkin/11/**'
      - 'assessments/5-math-vilenkin/11/**'
      - 'lessons/topic-links.js'
      - 'assessments/topic-links.js'
      - 'scripts/qa-grade5-vilenkin-topic11.mjs'
      - '.github/workflows/grade5-vilenkin-topic11-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'content/5-math-vilenkin/11.js'
      - 'topics/5-math-vilenkin/11.html'
      - 'lessons/5-math-vilenkin/11/**'
      - 'assessments/5-math-vilenkin/11/**'
      - 'lessons/topic-links.js'
      - 'assessments/topic-links.js'
      - 'scripts/qa-grade5-vilenkin-topic11.mjs'
      - '.github/workflows/grade5-vilenkin-topic11-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate grade 5 topic 11
        run: |
          cat lessons/5-math-vilenkin/11/variant-normalizer.js >> lessons/5-math-vilenkin/11/data.js
          node scripts/qa-grade5-vilenkin-topic11.mjs
