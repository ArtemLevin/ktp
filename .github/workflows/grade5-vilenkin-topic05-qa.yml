name: Grade 5 Vilenkin Topic 05 QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/5-math-vilenkin/05.js'
      - 'topics/5-math-vilenkin/05.html'
      - 'lessons/5-math-vilenkin/05/**'
      - 'assessments/5-math-vilenkin/05/**'
      - 'labs/5-math-vilenkin/area-volume/**'
      - 'lessons/topic-links.js'
      - 'assessments/topic-links.js'
      - 'scripts/qa-grade5-vilenkin-topic05.mjs'
      - '.github/workflows/grade5-vilenkin-topic05-qa.yml'
  push:
    branches:
      - main
    paths:
      - 'content/5-math-vilenkin/05.js'
      - 'topics/5-math-vilenkin/05.html'
      - 'lessons/5-math-vilenkin/05/**'
      - 'assessments/5-math-vilenkin/05/**'
      - 'labs/5-math-vilenkin/area-volume/**'
      - 'lessons/topic-links.js'
      - 'assessments/topic-links.js'
      - 'scripts/qa-grade5-vilenkin-topic05.mjs'
      - '.github/workflows/grade5-vilenkin-topic05-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate grade 5 topic 05
        run: node scripts/qa-grade5-vilenkin-topic05.mjs
