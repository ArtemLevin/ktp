name: Grade 10 Atanasyan Topic 04 Lessons 52-60 Lab QA

on:
  pull_request:
    paths:
      - 'content/10-geometry-atanasyan/04.js'
      - 'content/10-geometry-atanasyan/04-methodical-plan.md'
      - 'topics/10-geometry-atanasyan/04.html'
      - 'lessons/10-geometry-atanasyan/04/**'
      - 'labs/10-geometry-atanasyan/polyhedron-section/**'
      - 'scripts/qa-grade10-geometry-topic04-lessons-b*.mjs'
      - '.github/workflows/grade10-geometry-topic04-lessons-b-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'lessons/10-geometry-atanasyan/04/**'
      - 'labs/10-geometry-atanasyan/polyhedron-section/**'
      - 'scripts/qa-grade10-geometry-topic04-lessons-b*.mjs'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lessons 52-60 and lab structural/math QA
        run: node scripts/qa-grade10-geometry-topic04-lessons-b.mjs
      - name: Lessons 43-51 regression
        run: node scripts/qa-grade10-geometry-topic04-lessons-a.mjs
      - name: Topic 04 core regression
        run: node scripts/qa-grade10-geometry-topic04-core.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Lessons 52-60 and lab browser/mobile/print QA
        run: node scripts/qa-grade10-geometry-topic04-lessons-b-browser.mjs
