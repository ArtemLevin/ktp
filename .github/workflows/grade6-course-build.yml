name: Build Grade 6 Vilenkin Course

on:
  push:
    branches:
      - feature/6-math-vilenkin-course-final-release
    paths:
      - '.github/workflows/grade6-course-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/6-math-vilenkin-course-final-release
          fetch-depth: 0

      - name: Assemble corrected builder
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.grade6-builder/final_* | tr -d '\n\r ' | base64 -d > /tmp/grade6-builder.tar.xz
          echo 'b48b63911c2b256aecb052f04480cdee736340b0325d3e3d286deeed864bad83  /tmp/grade6-builder.tar.xz' | sha256sum -c -
          tar -xJf /tmp/grade6-builder.tar.xz -C /tmp
          test -f /tmp/g6builderpack2/build.mjs
          test -f /tmp/g6builderpack2/common-template.js
          cp /tmp/g6builderpack2/common-template.js scripts/.grade6-builder/common-template.js
          node --check /tmp/g6builderpack2/build.mjs
          node --check scripts/.grade6-builder/common-template.js
          node /tmp/g6builderpack2/build.mjs

      - name: Verify generated course
        shell: bash
        run: |
          set -euo pipefail
          test -f lessons/6-math-vilenkin/lesson-plan.md
          test -f scripts/qa-grade6-vilenkin-course.mjs
          node scripts/qa-grade6-vilenkin-course.mjs

      - name: Commit generated course
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/.grade6-builder scripts/.grade6-course-payload
          rm -f scripts/_grade6_payload_01.txt
          rm -f .github/workflows/grade6-vilenkin-course-qa.yml
          git config user.name 'KTP Course Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Complete grade 6 Vilenkin course'
          git push origin HEAD:feature/6-math-vilenkin-course-final-release
