name: Grade 11 Atanasyan Topic 02 Foundation QA

on:
  pull_request:
    paths:
      - 'content/11-geometry-atanasyan/02.js'
      - 'content/11-geometry-atanasyan/02-methodical-plan.md'
      - 'topics/11-geometry-atanasyan/02.html'
      - 'geometry/grade11-volume-scenes.js'
      - 'lessons/11-geometry-atanasyan/02/**'
      - 'scripts/qa-grade11-geometry-topic02-*.mjs'
      - '.github/workflows/grade11-geometry-topic02-foundation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'content/11-geometry-atanasyan/02.js'
      - 'content/11-geometry-atanasyan/02-methodical-plan.md'
      - 'topics/11-geometry-atanasyan/02.html'
      - 'geometry/grade11-volume-scenes.js'
      - 'lessons/11-geometry-atanasyan/02/**'
      - 'scripts/qa-grade11-geometry-topic02-*.mjs'
      - '.github/workflows/grade11-geometry-topic02-foundation-qa.yml'

permissions:
  contents: read

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Topic 02 blueprint and thematic content
        run: node scripts/qa-grade11-geometry-topic02-foundation.mjs
      - name: Topic 02 lesson modules and math
        run: node scripts/qa-grade11-geometry-topic02-lessons.mjs
      - name: Grade 11 regressions
        run: |
          node scripts/qa-grade11-geometry-foundation.mjs
          node scripts/qa-grade11-geometry-topic01-lessons.mjs
      - name: Previous geometry release regression
        run: |
          node scripts/qa-grade10-geometry-topic05-final.mjs
          node scripts/qa-grade10-geometry-topic05-final-docs.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Topic 02 page, scenes, mobile and print
        run: node scripts/qa-grade11-geometry-topic02-foundation-browser.mjs
      - name: Topic 02 lessons, mobile and print
        run: node scripts/qa-grade11-geometry-topic02-lessons-browser.mjs
