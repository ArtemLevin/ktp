name: Grade 10 Atanasyan Topic 05 Lessons 61-64 QA

on:
  pull_request:
    paths:
      - 'lessons/10-geometry-atanasyan/05/**'
      - 'scripts/qa-grade10-geometry-topic05-lessons-a*.mjs'
      - '.github/workflows/grade10-geometry-topic05-lessons-a-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'lessons/10-geometry-atanasyan/05/**'
      - 'scripts/qa-grade10-geometry-topic05-lessons-a*.mjs'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lessons 61-64 structural/source/math QA
        run: node scripts/qa-grade10-geometry-topic05-lessons-a.mjs
      - name: Topic 05 core regression
        run: node scripts/qa-grade10-geometry-topic05-core.mjs
      - name: Planning regression
        run: node scripts/qa-grade10-geometry-topic05-plan.mjs
      - name: Topic 04 release regression
        run: |
          node scripts/qa-grade10-geometry-topic04-final.mjs
          node scripts/qa-grade10-geometry-topic04-final-docs.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Lessons 61-64 browser/mobile/print QA
        run: node scripts/qa-grade10-geometry-topic05-lessons-a-browser.mjs
