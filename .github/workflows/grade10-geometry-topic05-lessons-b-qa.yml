name: Grade 10 Atanasyan Topic 05 Stage 4 Release QA

on:
  pull_request:
    paths:
      - 'content/10-geometry-atanasyan/05.js'
      - 'content/10-geometry-atanasyan/05-methodical-plan.md'
      - 'topics/10-geometry-atanasyan/05.html'
      - 'lessons/10-geometry-atanasyan/05/**'
      - 'labs/10-geometry-atanasyan/spatial-router/**'
      - 'scripts/qa-grade10-geometry-topic05-lessons-b*.mjs'
      - '.github/workflows/grade10-geometry-topic05-lessons-b-qa.yml'
  push:
    branches: [ main ]
    paths:
      - 'lessons/10-geometry-atanasyan/05/**'
      - 'labs/10-geometry-atanasyan/spatial-router/**'
      - 'scripts/qa-grade10-geometry-topic05-lessons-b*.mjs'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lessons 65-68 and router structural/math QA
        run: node scripts/qa-grade10-geometry-topic05-lessons-b.mjs
      - name: Lessons 61-64 regression
        run: node scripts/qa-grade10-geometry-topic05-lessons-a.mjs
      - name: Topic 05 core regression
        run: node scripts/qa-grade10-geometry-topic05-core.mjs
      - name: Topic 05 planning regression
        run: node scripts/qa-grade10-geometry-topic05-plan.mjs
      - name: Topic 04 release regression
        run: |
          node scripts/qa-grade10-geometry-topic04-final.mjs
          node scripts/qa-grade10-geometry-topic04-final-docs.mjs
      - name: Foundation regression
        run: node scripts/qa-grade10-geometry-foundation.mjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Stage 4 browser/mobile/router/print QA
        run: node scripts/qa-grade10-geometry-topic05-lessons-b-browser.mjs
