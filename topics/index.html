<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Страницы тем — KTP 3.0</title><link rel="stylesheet" href="topic-page.css"><style>.catalog-grid{display:grid;gap:14px;margin-top:14px}.catalog-group{border:1px solid var(--line);border-radius:18px;background:#fff;padding:18px}.catalog-group h2{margin:0 0 10px}.line{padding:12px 0;border-top:1px solid #f0f1f3}.line:first-of-type{border-top:0}.line h3{font-size:13px;margin:0 0 8px;color:#344054}.links{display:flex;flex-wrap:wrap;gap:7px}.links a{padding:7px 9px;border:1px solid #e4e7ec;border-radius:9px;text-decoration:none;font-size:11px;color:#475467;background:#fafbfc}.links a:hover{border-color:#c7d2fe;color:#4338ca;background:#eef2ff}</style></head><body><div id="app"></div><script src="../js/data.js"></script><script>(function(){const esc=v=>String(v).replace(/[&<>\"]/g,c=>c==='&'?'&amp;':c==='<'?'&lt;':c==='>'?'&gt;':'&quot;');const groups=[...new Set(KTP_DATA.rows.map(r=>r.grade))];document.getElementById('app').innerHTML=`<main class="page"><div class="topbar"><a class="back" href="../index.html">← KTP 3.0</a></div><section class="hero"><div class="eyebrow">Каталог страниц</div><h1>Все темы КТП</h1><div class="live-note">${KTP_DATA.rows.reduce((s,r)=>s+r.topics.length,0)} адресных страниц-заглушек для 17 учебных линий.</div></section><div class="catalog-grid">${groups.map(g=>`<section class="catalog-group"><h2>${g} класс</h2>${KTP_DATA.rows.filter(r=>r.grade===g).map(r=>`<div class="line"><h3>${esc(r.subject)} · ${esc(r.book)}</h3><div class="links">${r.topics.map((t,i)=>`<a href="${r.id}/${String(i+1).padStart(2,'0')}.html">${i+1}. ${esc(t.title)}</a>`).join('')}</div></div>`).join('')}</section>`).join('')}</div></main>`})();</script></body></html>
